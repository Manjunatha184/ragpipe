services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragpipe
      POSTGRES_USER: ragpipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpipe}
    ports:
      - "5432:5432"
    volumes:
      - ragpipe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragpipe -d ragpipe"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  ragpipe_postgres:

