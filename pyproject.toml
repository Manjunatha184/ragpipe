[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ragpipe"
version = "0.1.0"
description = "Incremental, idempotent document-to-pgvector synchronization pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Manjunatha"}]
dependencies = [
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "structlog>=24.4,<26",
  "alembic>=1.14,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<2", "build>=1.2,<2"]
s3 = ["boto3>=1.35,<2"]

[project.scripts]
ragpipe = "ragpipe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ragpipe"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=ragpipe --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = ["integration: requires Docker/Postgres"]

[tool.coverage.run]
omit = [
  "*/ragpipe/cli.py",
  "*/ragpipe/config.py",
  "*/ragpipe/embedding/local_provider.py",
  "*/ragpipe/logging.py",
  "*/ragpipe/store/pgvector_store.py",
]

[tool.coverage.report]
omit = [
  "*/ragpipe/cli.py",
  "*/ragpipe/config.py",
  "*/ragpipe/embedding/local_provider.py",
  "*/ragpipe/logging.py",
  "*/ragpipe/store/pgvector_store.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true
