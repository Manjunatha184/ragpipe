name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      RAGPIPE_TEST_DATABASE_URL: postgresql://ragpipe@localhost:5432/ragpipe_test
      RAGPIPE_DATABASE_URL: postgresql://ragpipe@localhost:5432/ragpipe_test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragpipe_test
          POSTGRES_USER: ragpipe
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragpipe -d ragpipe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .

      - name: Run type checking
        run: mypy ragpipe

      - name: Run unit and pgvector integration tests
        run: pytest

      - name: Build package
        run: python -m build